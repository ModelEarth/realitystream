<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RealityStream Run Models</title>
<link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
<!--
  Home page of the RealityStream Cloud Run service, served at / by models/main.py.
  {{ASSET_BASE}} is the webroot that shared files load from: https://model.earth/ on Cloud Run,
  or http://localhost:8887/ when testing locally (ASSET_BASE env var).
  The same shared files make up realitystream/models/:
  cloud/run/js/param-input.js (parameter base, features and targets, YAML),
  realitystream/js/model-select.js (models and their details, from realitystream/models/README.md) and
  realitystream/js/run-panel.js (today's usage, SMOTE choice, Run button and results).
-->
<link rel="stylesheet" href="{{ASSET_BASE}}cloud/run/css/param.css">
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="{{ASSET_BASE}}localsite/js/localsite.js?showheader=false"></script>
<script src="{{ASSET_BASE}}localsite/js/showdown.min.js"></script>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#5d6675; --line:#e3e6eb; --accent:#2f6fde; }
/* localsite.js sets body.dark for the site's dark theme, which param.css also uses */
body.dark { --bg:#14171c; --panel:#1d2128; --text:#e6e9ef; --muted:#9aa3b2; --line:#2c323c; --accent:#5b8ff0; }
body { margin:0; background:var(--bg) !important; color:var(--text) !important; font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
main { max-width:900px; margin:0 auto; padding:24px 16px 48px; }
h1 { font-size:24px; margin:0 0 4px; } h2 { font-size:16px; margin:0 0 12px; }
.sub { color:var(--muted); margin:0 0 20px; }
.panel { background:var(--panel); border-radius:12px; padding:18px 20px; margin-bottom:16px; }
.label { font-weight:600; margin:16px 0 6px; }
/* #parambase uses localsite's .ls-select (arrow kept clear of long text) and widens to its longest option */
#parambase { max-width:100%; }
/* Same YAML box as /realitystream/: localsite's .codetext plus these overrides */
#paramText { font-size:0.9em; overflow:scroll !important; padding-top:0px; padding-bottom:0px; outline:none; }
code { font-size:13px; }
a { color:var(--accent); }
</style>
</head>
<body data-param-input="realitystream-api">
<main>
<h1>RealityStream Run Models</h1>
<p class="sub">Choose parameters, datasets and models, then run them on Google Cloud Run. Opening this page doesn't run a model; only the Run button does.
Also at <a href="https://model.earth/realitystream/models/">model.earth/realitystream/models</a>.</p>

<section class="panel" id="rsUsage"></section>

<section class="panel">
  <h2>Models</h2>
  <div id="modelSelect"></div>
</section>

<section class="panel" data-rs-layout>
  <h2>Settings</h2>
  <select id="parambase" class="ls-select"></select>

  <!-- Features and targets, updated as the YAML below is edited -->
  <div id="pathControls"></div>
  <div id="paramText" class="codetext" contenteditable><pre>models: rfc</pre></div>

  <!-- This page is served by the API itself, so runs go to the same server -->
  <div id="rsRunControls" data-api="./"></div>
</section>

<section class="panel" id="rsResults"></section>

<section class="panel">
  <h2>API endpoints</h2>
  <div id="rsEndpoints"></div>
</section>
<p class="sub"><a href="https://github.com/ModelEarth/realitystream/blob/main/models/main.py">Source: models/main.py</a></p>
</main>

<script src="{{ASSET_BASE}}cloud/run/js/param-input.js"></script>
<script src="{{ASSET_BASE}}realitystream/js/model-select.js"></script>
<script src="{{ASSET_BASE}}realitystream/js/run-panel.js"></script>
</body>
</html>
