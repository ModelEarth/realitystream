<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<title>RealityStream - ML Model Overview and Selection</title>
<link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Choose parameters, datasets and models, then run them on the RealityStream Cloud Run API.
  Formerly cloud/run/page.html, combined with the model overview from README.md.
  The same shared files make up the Cloud Run home page (home.html):
  cloud/run/js/param-input.js (parameter base, features and targets, YAML),
  realitystream/js/model-select.js (models and their details, from README.md) and
  realitystream/js/run-panel.js (today's usage, SMOTE choice, Run button and results).
-->
<script type="text/javascript" src="../../localsite/js/localsite.js?showheader=true"></script>
<link rel="stylesheet" href="../../cloud/run/css/param.css">
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="../../localsite/js/showdown.min.js"></script>
<style>
.rs-panel { border-radius:12px; padding:18px 20px; margin:0 0 16px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.dark .rs-panel { background:#1d2128; box-shadow:none; }
.rs-panel h2 { font-size:18px; margin:0 0 12px; }
.rs-label { font-weight:600; margin:16px 0 6px; }
#parambase { padding:6px 8px; border-radius:8px; max-width:100%; }
/* Same YAML box as /realitystream/: localsite's .codetext plus these overrides */
#paramText { font-size:0.9em; overflow:scroll !important; padding-top:0px; padding-bottom:0px; outline:none; }
</style>
<script>
// Intro (beside Run Models) returns to the RealityStream intro page with the selected models in the hash
function redirectToMainPage() {
  const selected = RSModelSelect.selected();
  if (!selected.length) {
    alert("Please select a model first.");
    return;
  }
  const currentHash = getHash();
  currentHash.models = selected.join(',');
  updateHash(currentHash);
  window.location.href = '../' + window.location.hash;
}
</script>
</head>

<body data-param-input="realitystream-api">

<div class="content contentpadding">
  <div id="readmeIntro"></div>

  <section class="rs-panel" id="rsUsage"></section>

  <section class="rs-panel">
    <h2>Models</h2>
    <div id="modelSelect"></div>
  </section>

  <section class="rs-panel" data-rs-layout>
    <h2>Settings</h2>
    <select id="parambase"></select>

    <!-- Features and targets, updated as the YAML below is edited -->
    <div id="pathControls"></div>
    <div id="paramText" class="codetext" contenteditable><pre>models: rfc</pre></div>

    <div id="rsRunControls"></div>
  </section>

  <section class="rs-panel" id="rsResults"></section>

  <div id="readmeOutro"></div>
</div>

<script src="../../cloud/run/js/param-input.js"></script>
<script src="../js/model-select.js"></script>
<script src="../js/run-panel.js"></script>
<script>
// Intro (back to RealityStream with the selected models) at the far right of the Run button.
// run-panel.js builds the Run button when the page has loaded, so add Intro after that.
document.addEventListener('DOMContentLoaded', () => {
  const runButton = document.querySelector('#rsRunControls .rs-run-button');
  if (!runButton) return;
  const introButton = document.createElement('button');
  introButton.type = 'button';
  // localsite's .btn-clear: transparent with a border
  introButton.className = 'btn btn-clear rs-intro-button';
  introButton.textContent = 'Intro';
  introButton.addEventListener('click', redirectToMainPage);
  runButton.parentElement.appendChild(introButton);
});

// The README's intro and closing text surround the settings; its model sections are in the picker
RSModelSelect.loadReadme().then(readme => {
  RSModelSelect.renderMarkdown(document.getElementById('readmeIntro'), readme.intro);
  RSModelSelect.renderMarkdown(document.getElementById('readmeOutro'), readme.outro);
});
</script>
</body>
</html>
